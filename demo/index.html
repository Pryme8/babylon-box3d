<!doctype html>
<html lang="en">
    <head>
        <title>Box3D for Babylon.js</title>
        <!-- Adds the cross origin isolation headers on a static host, so the threaded Box3D build can start. Harmless anywhere else. -->
        <script src="./coi-serviceworker.js"></script>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, user-scalable=no" />
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden;
                background: #1f2129;
            }
            #babylon-canvas {
                width: 100%;
                height: 100%;
                outline: none;
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <canvas id="babylon-canvas" tabindex="1"></canvas>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
